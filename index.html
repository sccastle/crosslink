<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0F1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Crosslink">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-192.png">
<title>Crosslink</title>
<style>
:root{
  --ink:#0B0F1A;
  --ink2:#101726;
  --ink3:#18202F;
  --line:#22303F;
  --line2:#18222E;
  --paper:#DBE4F0;
  --dim:#7E8FA3;
  --dim2:#556678;
  --brass:#9B8AD8;
  --lamp:#5FA37A;
  --hot:#C2705E;
  --accent2:#9B8AD8;
  --lift1:linear-gradient(180deg,#16212E 0%,#0E1826 100%);
  --lift2:linear-gradient(180deg,rgba(219,228,240,.05) 0%,rgba(219,228,240,0) 100%);
  --mono:ui-monospace,SFMono-Regular,"SF Mono","JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;padding:0}
body{background:var(--ink);color:var(--paper);font-family:var(--sans);font-size:15px;line-height:1.5;
  padding-bottom:calc(62px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
input,select,textarea{background:var(--ink);border:1px solid var(--line);border-radius:4px;padding:9px 10px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:1px solid var(--brass);outline-offset:1px}
textarea{resize:vertical;min-height:62px}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

header{position:sticky;top:0;z-index:20;background:var(--ink);border-bottom:1px solid var(--line);
  padding:calc(11px + env(safe-area-inset-top)) 16px 11px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--mono);font-size:16.5px;font-weight:700;letter-spacing:.08em}
.brand em{font-family:var(--sans);font-style:normal;font-size:11.5px;font-weight:400;color:var(--dim2);letter-spacing:.12em;margin-left:9px}
.hact{display:flex;gap:2px;align-items:center}
.iconbtn{background:none;border:0;color:var(--dim);font-size:20px;line-height:1;padding:4px 8px;cursor:pointer}
.iconbtn.plus{color:var(--brass);font-size:25px}
.stat{margin-top:8px;font-family:var(--mono);font-size:11.5px;color:var(--dim);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.stat b{color:var(--paper);font-weight:500}
.rule{margin-top:8px;height:1px;background:var(--line2);position:relative}
.rule>i{position:absolute;left:0;top:0;height:1px;background:var(--brass);width:0}

main{padding:14px 15px 36px;max-width:820px;margin:0 auto}
.cols{display:block}
.colA,.colB{min-width:0}
h2.sec{font-size:14px;font-weight:700;letter-spacing:.02em;margin:24px 0 10px;padding-bottom:8px;
  border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;align-items:baseline}
h2.sec:first-child{margin-top:0}
h2.sec small{font-family:var(--mono);font-size:11px;font-weight:400;letter-spacing:.06em;color:var(--dim2)}
.eyebrow{font-family:var(--mono);font-size:10.5px;color:var(--dim2);letter-spacing:.3em;margin-bottom:5px}
.sub{color:var(--dim);font-size:12.5px}

.fold{border-top:1px solid var(--line)}
.fold>summary{list-style:none;cursor:pointer;padding:14px 2px;min-height:50px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary .lbl{font-size:14px;font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:9px}
.fold>summary .meta{font-family:var(--mono);font-size:11px;color:var(--dim2);letter-spacing:.06em}
.fold .caret{color:var(--dim2);font-size:9px;transition:transform .18s ease}
.fold[open] .caret{transform:rotate(90deg)}
.foldbody{padding-bottom:16px}

.calhead{display:flex;align-items:center;justify-content:space-between;padding:0 0 10px}
.calhead b{font-family:var(--mono);font-weight:500;letter-spacing:.1em;font-size:14px;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line2);border-left:1px solid var(--line2)}
.dow{padding:6px 0;text-align:center;font-family:var(--mono);font-size:10px;color:var(--dim2);
  border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);letter-spacing:.1em}
.day{aspect-ratio:1;border:0;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);
  background:none;color:var(--paper);cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;position:relative}
.day.out{color:var(--dim2)}
.day.today .dnum{border-bottom:1px solid var(--brass);padding-bottom:1px}
.dnum{position:relative;z-index:2}
.half{position:absolute;left:0;right:0;height:50%;z-index:1;pointer-events:none}
.half.top{top:0;border-bottom:1px solid rgba(11,15,26,.5)}
.half.bot{bottom:0}
.s-need{background:rgba(230,201,110,.38)}
.s-set{background:rgba(120,170,220,.34)}
.s-done{background:rgba(219,228,240,.09);
  background-image:linear-gradient(to top right,transparent calc(50% - .5px),rgba(219,228,240,.34) calc(50% - .5px),rgba(219,228,240,.34) calc(50% + .5px),transparent calc(50% + .5px))}
.day.sel{box-shadow:inset 0 0 0 1px var(--brass);z-index:3}
.legend{display:flex;gap:16px;margin-top:9px;font-family:var(--mono);font-size:10.5px;color:var(--dim2);letter-spacing:.04em}
.legend{flex-wrap:wrap;row-gap:5px}
.legend i.lg{display:inline-block;width:12px;height:12px;vertical-align:-2px;margin-right:5px;border:1px solid var(--line)}
.legend i.n{background:rgba(230,201,110,.34)}
.legend i.t{background:rgba(120,170,220,.32)}
.legend i.d{background:rgba(219,228,240,.08);
  background-image:linear-gradient(to top right,transparent calc(50% - .5px),rgba(219,228,240,.4) calc(50% - .5px),rgba(219,228,240,.4) calc(50% + .5px),transparent calc(50% + .5px))}

.det{border:1px solid var(--line);border-radius:4px;padding:12px 13px;margin-bottom:9px;background:var(--ink2);cursor:pointer}
.det .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.det .ty{font-weight:600}
.det .pl{font-family:var(--mono);font-size:12px;color:var(--dim)}
.det .who{font-size:13px;margin-top:6px}
.det .txt{font-size:13px;color:var(--dim);margin-top:5px}
.pill{font-family:var(--mono);font-size:10px;border:1px solid var(--brass);color:var(--brass);border-radius:2px;padding:1px 4px;letter-spacing:.08em}
.pill.g{border-color:var(--dim2);color:var(--dim2)}
.pill.b{border-color:rgba(120,170,220,.7);color:#8FB6DE}
.auto{font-family:var(--mono);font-size:10px;color:var(--dim2);letter-spacing:.06em}
.pin{color:var(--accent2);font-size:11px;flex:none}
.tierrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line2)}
.tierrow input{width:auto;flex:1;min-width:0}
.shots{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.shots img{width:52px;height:52px;object-fit:cover;border:1px solid var(--line);border-radius:3px;display:block}

.bd{display:flex;align-items:center;gap:11px;padding:11px;min-height:46px;border:1px solid var(--line2);border-radius:3px;
  margin-bottom:6px;width:100%;text-align:left;background:none;color:var(--paper);cursor:pointer}
.bd.soon{background:rgba(155,138,216,.15);border-color:rgba(155,138,216,.4)}
.bd .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd .d{font-family:var(--mono);font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.bd.soon .d{color:var(--brass)}

.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-bottom:12px}
.seg button{flex:1;background:none;border:0;padding:8px 4px;color:var(--dim);cursor:pointer;
  font-family:var(--mono);font-size:12px;letter-spacing:.08em}
.seg button.on{background:var(--ink3);color:var(--paper)}

.bank{border-bottom:1px solid var(--line2)}
.bank>summary{list-style:none;cursor:pointer;padding:13px 2px;min-height:48px;display:flex;align-items:center;gap:10px}
.bank>summary::-webkit-details-marker{display:none}
.bank .caret{color:var(--dim2);font-size:9px;flex:none;transition:transform .18s ease}
.bank[open] .caret{transform:rotate(90deg)}
.bname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.cnt{font-family:var(--mono);color:var(--dim);font-size:12px;flex:none;font-variant-numeric:tabular-nums}
.trow{display:flex;align-items:center;gap:11px;padding:11px 2px 11px 14px;min-height:46px;width:100%;text-align:left;
  background:none;border:0;border-top:1px solid var(--line2);cursor:pointer;color:var(--paper)}
.trow:active{background:var(--ink2)}
.lamp{width:9px;height:9px;border-radius:50%;border:1px solid var(--dim2);flex:none}
.lamp.on{background:var(--lamp);border-color:var(--lamp);box-shadow:0 0 6px rgba(95,163,122,.5)}
.tname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tier{font-family:var(--mono);font-size:10px;color:var(--dim2);border:1px solid var(--line);border-radius:2px;padding:0 4px;flex:none}
.ago{font-family:var(--mono);font-size:12px;color:var(--dim);flex:none;font-variant-numeric:tabular-nums}
.ago.warn{color:var(--brass)}
.ago.hot{color:var(--hot)}
.gh{font-family:var(--mono);font-size:11px;color:var(--brass);letter-spacing:.24em;padding:14px 0 4px;border-bottom:1px solid var(--line2)}
.idx{position:fixed;right:2px;top:50%;transform:translateY(-45%);z-index:15;display:flex;flex-direction:column}
.idx button{background:none;border:0;color:var(--dim2);font-family:var(--mono);font-size:9.5px;line-height:1.3;padding:0 5px;cursor:pointer}
.idx button.has{color:var(--brass)}

.btn{background:none;border:1px solid var(--line);border-radius:4px;padding:9px 14px;cursor:pointer;color:var(--paper)}
.btn:active{background:var(--ink3)}
.btn.pri{background:var(--brass);color:#15101F;border-color:var(--brass);font-weight:600}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.wide{width:100%}
.btn.danger{color:var(--hot);border-color:rgba(194,112,94,.4)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.empty{border:1px dashed var(--line);border-radius:4px;padding:24px 16px;text-align:center;color:var(--dim)}
.empty p{margin:0 0 13px}
.field{margin-bottom:12px}
.field label{display:block;font-family:var(--mono);font-size:10.5px;color:var(--dim2);margin-bottom:5px;letter-spacing:.14em}
.hint{font-size:11.5px;color:var(--dim2);margin-top:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:2px;padding:6px 11px 6px 9px;
  background:none;cursor:pointer;font-size:13.5px;color:var(--paper)}
.chip.on{border-color:rgba(95,163,122,.5)}
.boardbank{margin-bottom:17px}
.boardbank h3{font-size:12px;margin:0 0 8px;font-weight:600;color:var(--dim);display:flex;justify-content:space-between}
.boardbank h3 span{font-family:var(--mono);font-weight:400}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:2px;
  background:var(--lift1);border-top:1px solid #2B3B4D;
  box-shadow:inset 0 1px 0 rgba(219,228,240,.06),0 -14px 30px rgba(0,0,0,.55);
  -webkit-backdrop-filter:saturate(1.3) blur(12px);backdrop-filter:saturate(1.3) blur(12px);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;background:none;border:0;padding:8px 2px 7px;color:var(--dim2);cursor:pointer;
  font-size:11.5px;letter-spacing:.1em;position:relative;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;min-height:50px;border-radius:9px;isolation:isolate}
nav.tabs .ic{font-size:15px;line-height:1}
nav.tabs button::before{content:"";position:absolute;inset:0;border-radius:9px;z-index:-1;
  background:transparent;box-shadow:none;transition:background .16s ease,box-shadow .16s ease}
nav.tabs button.on{color:var(--paper)}
nav.tabs button.on::before{
  background:linear-gradient(180deg,rgba(155,138,216,.20) 0%,rgba(155,138,216,.05) 100%);
  box-shadow:inset 0 1px 0 rgba(155,138,216,.45),inset 0 -1px 0 rgba(0,0,0,.35),0 3px 8px rgba(0,0,0,.45)}
nav.tabs button.on .ic{color:var(--brass)}

.mask{position:fixed;inset:0;background:rgba(4,8,13,.78);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--ink2);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:6px 6px 0 0;
  border:1px solid var(--line);border-bottom:0;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
@media(min-width:761px){.mask{align-items:center}.sheet{border-radius:6px;border-bottom:1px solid var(--line);max-height:86vh}}
.shead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:16px;
  padding-bottom:11px;border-bottom:1px solid var(--line2)}
.shead h3{margin:0;font-size:18px;font-weight:700;letter-spacing:.02em}
.x{background:none;border:0;color:var(--dim);font-size:22px;line-height:1;cursor:pointer;padding:0 4px}
dl.kv{margin:0;display:grid;grid-template-columns:70px 1fr;gap:9px 12px;font-size:14px}
dl.kv dt{font-family:var(--mono);color:var(--dim2);font-size:10.5px;padding-top:3px;letter-spacing:.1em}
dl.kv dd{margin:0;word-break:break-word}
.picker{max-height:36vh;overflow:auto;border:1px solid var(--line);border-radius:4px}
.pk{display:flex;align-items:center;gap:10px;padding:9px 11px;border-top:1px solid var(--line2);cursor:pointer}
.pk:first-child{border-top:0}
.pk input{width:auto;flex:none}
.pkb{font-family:var(--mono);font-size:10.5px;color:var(--dim2);margin-left:auto}
.thumbs{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.th{position:relative;width:64px;height:64px;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:var(--ink)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th button{position:absolute;top:0;right:0;background:rgba(4,8,13,.8);border:0;color:var(--paper);font-size:12px;line-height:1;padding:3px 5px;cursor:pointer}
.typerow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line2)}
.typerow span{flex:1}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--paper);color:var(--ink);
  padding:9px 16px;border-radius:2px;font-size:13px;z-index:60;max-width:88vw;text-align:center}
.warnbar{border:1px solid rgba(155,138,216,.38);color:var(--brass);border-radius:3px;padding:9px 11px;font-size:12px;margin-bottom:14px}
.blank{border:1px dashed var(--line);border-radius:4px;padding:18px 15px;color:var(--dim);font-size:13.5px}
.bar{height:3px;background:var(--ink3);border-radius:2px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--brass)}
.note{display:flex;align-items:flex-start;gap:9px;padding:10px 0;border-top:1px solid var(--line2)}
.note .tag{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--accent2);
  border:1px solid rgba(155,138,216,.45);border-radius:2px;padding:1px 5px;flex:none;margin-top:2px}
.note .ntx{flex:1;min-width:0;font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.day-fold{border-top:1px solid var(--line2)}
.day-fold[open]{background:linear-gradient(180deg,rgba(219,228,240,.03),transparent)}
.viewer img{width:100%;border-radius:4px;display:block}
/* 窄屏 / 折叠屏外屏 */
@media(max-width:359px){
  body{font-size:14px}
  main{padding:12px 11px 32px}
  .brand{font-size:15.5px}
  .brand em{letter-spacing:.2em;margin-left:6px}
  .day{font-size:11.5px}
  .dow{font-size:9px;letter-spacing:.06em}
  .legend{gap:10px;font-size:9.5px}
  h2.sec{font-size:13px}
  .tier{display:none}
  nav.tabs button{font-size:11px;letter-spacing:.04em}
}
/* 折叠屏展开 / 平板：日历与名单并排 */
@media(min-width:620px){
  .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 26px;align-items:start}
  .colB>h2.sec:first-child{margin-top:0}
  main{padding-bottom:40px}
  .day{font-size:14px}
}
@media(min-width:900px){main{max-width:880px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="brand">Crosslink<em>客户台账</em></div>
    <div class="hact">
      <button class="iconbtn plus" id="quick" aria-label="新增">+</button>
      <button class="iconbtn" id="gear" aria-label="设置">⚙</button>
    </div>
  </div>
  <div class="stat" id="cycleInfo"></div>
  <div class="rule"><i id="meterBar"></i></div>
</header>

<main id="view"></main>

<nav class="tabs">
  <button data-tab="clients" class="on"><span class="ic">▤</span>客户</button>
  <button data-tab="board"><span class="ic">◍</span>轮次</button>
  <button data-tab="weekly"><span class="ic">✎</span>周报</button>
</nav>

<div id="modalRoot"></div>

<script>
"use strict";

var KEY="fx_client_ledger_v1";
var storeOK=true, db=null;
var DEF_TYPES=["饭局","酒局","咖啡","高尔夫","运动","拜访","其他"];

var DEF_TIERS=[{k:"A",d:30},{k:"B",d:60},{k:"C",d:90}];
function blank(){return{v:5,settings:{cycle:"quarter",types:DEF_TYPES.slice(),tiers:JSON.parse(JSON.stringify(DEF_TIERS)),remindDays:3},banks:[],traders:[],events:[],notes:[]};}
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(!raw)return blank();
    var d=JSON.parse(raw);
    d.settings=d.settings||{};
    d.settings.cycle=d.settings.cycle||"quarter";
    if(!d.settings.types||!d.settings.types.length)d.settings.types=DEF_TYPES.slice();
    if(!d.settings.tiers||!d.settings.tiers.length)d.settings.tiers=JSON.parse(JSON.stringify(DEF_TIERS));
    if(!d.settings.remindDays)d.settings.remindDays=3;
    d.banks=d.banks||[];d.traders=d.traders||[];d.events=d.events||[];d.notes=d.notes||[];
    d.events.forEach(function(e){e.photos=e.photos||[];});
    var legacy={A:30,B:60,C:90};
    d.traders.forEach(function(t){
      if(typeof t.days==="number"&&t.days>0)return;
      var v=null;
      if(d.settings.tiers)d.settings.tiers.forEach(function(x){if(x.k===t.tier)v=x.d;});
      t.days=v||legacy[t.tier]||60;
    });
    return d;
  }catch(e){storeOK=false;return blank();}
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(db));return true;}
  catch(e){
    if(e&&(e.name==="QuotaExceededError"||e.code===22))toast("存储满了。先导出备份，再删掉一些旧图片");
    else{storeOK=false;toast("这台设备存不了，数据只在本次会话有效");}
    return false;
  }
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
/* 过了日子还没删的计划，默认算已应酬；标 auto 以便区分，标 noshow 的不动 */
function autoComplete(d){
  var t=today(),changed=false;
  (d&&d.events||[]).forEach(function(e){
    if(!e.done&&!e.noshow&&e.date<t){e.done=true;e.auto=true;changed=true;}
  });
  return changed;
}

function pad(n){return n<10?"0"+n:""+n;}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function today(){return iso(new Date());}
function parse(s){var p=String(s).split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function daysBetween(a,b){return Math.round((parse(b)-parse(a))/86400000);}
function cn(s){var p=String(s).split("-");return (+p[1])+"月"+(+p[2])+"日";}
function md(s){var p=String(s).split("-");return (+p[1])+"/"+(+p[2]);}
function cycleRange(){
  var d=new Date(),y=d.getFullYear(),m=d.getMonth(),t=db.settings.cycle;
  if(t==="month")return{s:iso(new Date(y,m,1)),e:iso(new Date(y,m+1,0)),label:y+"-"+pad(m+1)};
  if(t==="half"){var h=m<6?0:1;return{s:iso(new Date(y,h*6,1)),e:iso(new Date(y,h*6+6,0)),label:y+" H"+(h+1)};}
  var q=Math.floor(m/3);
  return{s:iso(new Date(y,q*3,1)),e:iso(new Date(y,q*3+3,0)),label:y+" Q"+(q+1)};
}

var DEF_DAYS=60;
function goalDays(t){return (t&&t.days)?t.days:DEF_DAYS;}
function types(){return db.settings.types;}
function sortedBanks(){
  return db.banks.slice().sort(function(a,b){
    return (b.pinned?1:0)-(a.pinned?1:0);});
}
function pinned(bid){var b=bank(bid);return !!(b&&b.pinned);}
function bank(id){for(var i=0;i<db.banks.length;i++)if(db.banks[i].id===id)return db.banks[i];return null;}
function trader(id){for(var i=0;i<db.traders.length;i++)if(db.traders[i].id===id)return db.traders[i];return null;}
function event_(id){for(var i=0;i<db.events.length;i++)if(db.events[i].id===id)return db.events[i];return null;}
function bankName(id){var b=bank(id);return b?b.name:"（无归属）";}
function activeOf(bid){return db.traders.filter(function(t){return t.bankId===bid&&t.status==="active";});}
function doneEvents(tid){
  return db.events.filter(function(e){return e.done&&e.traderIds.indexOf(tid)>=0;})
    .sort(function(a,b){return a.date<b.date?1:-1;});
}
function lastSeen(tid){var e=doneEvents(tid);return e.length?e[0].date:null;}
function seenThisCycle(tid){
  var c=cycleRange();
  return db.events.some(function(e){return e.done&&e.traderIds.indexOf(tid)>=0&&e.date>=c.s&&e.date<=c.e;});
}
function overdueDays(t){var ls=lastSeen(t.id);return ls?daysBetween(ls,today()):null;}
function tracked(t){return pinned(t.bankId);}
function isOverdue(t){
  if(!tracked(t))return false;
  var d=overdueDays(t);
  return d===null?true:d>goalDays(t);
}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

var LT="ABCDEFGHJKLMNOPQRSTWXYZ".split("");
var BD=["阿","八","嚓","咑","妸","发","旮","铪","丌","咔","垃","妈","拏","噢","妑","七","呥","仨","他","屲","夕","丫","帀"];
var COLL=null;
try{COLL=new Intl.Collator("zh-CN");}catch(e){COLL=null;}
function initial(name){
  var ch=String(name||"").charAt(0);
  if(!ch)return "#";
  if(/[a-zA-Z]/.test(ch))return ch.toUpperCase();
  if(!COLL||ch.charCodeAt(0)<0x4e00)return "#";
  if(COLL.compare(ch,BD[0])<0)return "#";
  for(var i=LT.length-1;i>=0;i--)if(COLL.compare(ch,BD[i])>=0)return LT[i];
  return "#";
}
function sortName(a,b){return COLL?COLL.compare(a.name,b.name):(a.name<b.name?-1:1);}
/* 多音字：银行的行读 hang，几个常见姓氏也另有读法 */
var POLY={"行":"H","曾":"Z","单":"S","仇":"Q","解":"X","查":"Z","区":"O","翟":"Z","朴":"P","乐":"Y","覃":"Q","繁":"P","折":"S","首":"S"};
function initialsOf(name){
  var a="",b="",str=String(name||"");
  for(var i=0;i<str.length;i++){
    var ch=str.charAt(i),x=initial(ch);
    a+=x;b+=POLY[ch]||x;
  }
  return a===b?[a]:[a,b];
}
function matches(text,q){
  if(!q)return true;
  if(String(text).indexOf(q)>=0)return true;
  if(/^[a-zA-Z]+$/.test(q)){
    var Q=q.toUpperCase(),v=initialsOf(text);
    for(var i=0;i<v.length;i++)if(v[i].indexOf(Q)>=0)return true;
  }
  return false;
}

/* ---------- 日历 ---------- */
function calendarBlock(){
  var y=calMonth.getFullYear(),m=calMonth.getMonth();
  var mo=db.events.filter(function(e){var d=parse(e.date);return d.getFullYear()===y&&d.getMonth()===m;});
  var nd=mo.filter(function(e){return e.done;}).length;
  var h="<details class='fold' id='calwrap' style='border-top:0'"+(calOpen?" open":"")+">";
  h+="<summary><span class='lbl'><span class='caret'>▶</span>日程</span>"+
     "<span class='meta'>"+y+"/"+pad(m+1)+" · 已 "+nd+" / 待 "+(mo.length-nd)+"</span></summary><div class='foldbody'>";
  h+="<div class='calhead'>"+
     "<button class='btn sm' data-act='mv' data-d='-1'>‹</button>"+
     "<b>"+y+" / "+pad(m+1)+"</b>"+
     "<button class='btn sm' data-act='mv' data-d='1'>›</button></div>";
  var first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());
  h+="<div class='grid'>";
  ["S","M","T","W","T","F","S"].forEach(function(d){h+="<div class='dow'>"+d+"</div>";});
  for(var i=0;i<42;i++){
    var d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);
    var ds=iso(d);
    var evs=db.events.filter(function(e){return e.date===ds;});
    var cls="day";
    if(d.getMonth()!==m)cls+=" out";
    if(ds===today())cls+=" today";
    if(ds===calSel)cls+=" sel";
    var noon=slotState(evs,"noon"),night=slotState(evs,"night");
    h+="<button class='"+cls+"' data-act='pick' data-d='"+ds+"'>"+
       (noon?"<span class='half top "+noon+"'></span>":"")+
       (night?"<span class='half bot "+night+"'></span>":"")+
       "<span class='dnum'>"+d.getDate()+"</span></button>";
  }
  h+="</div><div class='legend'><span><i class='lg d'></i>已应酬</span>"+
     "<span><i class='lg n'></i>待订地点</span><span><i class='lg t'></i>已订地点</span>"+
     "<span>上格中午 · 下格晚上</span></div>";

  var sel=db.events.filter(function(e){return e.date===calSel;})
    .sort(function(a,b){return a.done===b.done?0:(a.done?1:-1);});
  h+="<h2 class='sec' style='margin-top:18px'>"+cn(calSel)+"<small>"+(sel.length?sel.length+" 项":"无安排")+"</small></h2>";
  if(sel.length)sel.forEach(function(e){h+=evCard(e);});
  else h+="<div class='sub'>这天没有安排。</div>";
  h+="<div class='row' style='margin-top:10px'>"+
     "<button class='btn sm' data-act='addPlan' data-d='"+calSel+"'>加计划</button>"+
     "<button class='btn sm' data-act='addEventOn' data-d='"+calSel+"'>记应酬</button></div>";
  return h+"</div></details>";
}
function slotOf(e){return e.slot==="noon"?"noon":"night";}
function slotState(evs,slot){
  var l=evs.filter(function(e){return slotOf(e)===slot&&!e.noshow;});
  if(!l.length)return "";
  if(l.some(function(e){return !e.done&&!e.place;}))return "s-need";
  if(l.some(function(e){return !e.done&&e.place;}))return "s-set";
  return "s-done";
}
function evCard(e,showDate){
  var names=e.traderIds.map(function(id){
    var t=trader(id);return t?t.name+"（"+bankName(t.bankId)+"）":"?";}).join(" ");
  var h="<div class='det' data-act='event' data-id='"+e.id+"'><div class='top'>"+
    (showDate?"<span class='pl'>"+md(e.date)+"</span>":"")+
    "<span class='pl'>"+(slotOf(e)==="noon"?"中午":"晚上")+"</span>"+
    "<span class='ty'>"+esc(e.type||"应酬")+"</span>"+
    (e.place?"<span class='pl'>"+esc(e.place)+"</span>":"")+
    "<span class='pill"+(e.noshow?" g":(e.done?" g":(e.place?" b":"")))+"'>"+
      (e.noshow?"未发生":(e.done?"已完成":(e.place?"已订地点":"待订地点")))+"</span>"+
    (e.auto&&e.done?"<span class='auto'>自动</span>":"")+"</div>"+
    "<div class='who'>"+esc(names||"未选人")+"</div>"+
    (e.topic?"<div class='txt'>"+esc(e.topic)+"</div>":"")+
    (e.followup?"<div class='txt'>跟进："+esc(e.followup)+"</div>":"");
  if(e.photos&&e.photos.length){
    h+="<div class='shots'>";
    e.photos.forEach(function(src,i){
      h+="<img src='"+src+"' alt='凭证' data-act='viewPhoto' data-id='"+e.id+"' data-i='"+i+"'>";});
    h+="</div>";
  }
  return h+"</div>";
}

/* ---------- 生日 ---------- */
function birthdaysSoon(n){
  var out=[],now=new Date();
  db.traders.forEach(function(t){
    if(t.status!=="active"||!t.birthday)return;
    var p=String(t.birthday).split("-");
    if(p.length<3)return;
    var nx=new Date(now.getFullYear(),+p[1]-1,+p[2]);
    if(iso(nx)<today())nx=new Date(now.getFullYear()+1,+p[1]-1,+p[2]);
    var gap=daysBetween(today(),iso(nx));
    if(gap<=n)out.push({t:t,d:gap,md:(+p[1])+"/"+(+p[2])});
  });
  return out.sort(function(a,b){return a.d-b.d;});
}
function birthdayBlock(){
  var bd=birthdaysSoon(30);
  var h="<h2 class='sec' style='margin-top:22px'>生日<small>30 天内 · "+bd.length+" 人</small></h2>";
  if(!bd.length)return h+"<div class='sub'>近一个月没有人过生日。</div>";
  bd.forEach(function(x){
    h+="<button class='bd"+(x.d<=7?" soon":"")+"' data-act='trader' data-id='"+x.t.id+"'>"+
       "<span class='d'>"+x.md+"</span>"+
       "<span class='n'>"+esc(x.t.name)+"<span class='sub'> · "+esc(bankName(x.t.bankId))+"</span></span>"+
       "<span class='d'>"+(x.d===0?"今天":x.d+" 天")+"</span></button>";
  });
  return h;
}

/* ---------- 客户管理 ---------- */
function traderRow(t,withBank){
  var d=overdueDays(t),lim=goalDays(t);
  var cls=tracked(t)?(d===null?"hot":(d>lim?"warn":"")):"";
  var txt=d===null?"未应酬":(d===0?"今天":d+"天");
  return "<button class='trow' data-act='trader' data-id='"+t.id+"'>"+
    "<span class='lamp"+(seenThisCycle(t.id)?" on":"")+"'></span>"+
    "<span class='tname'>"+esc(t.name)+(withBank?"<span class='sub'> · "+esc(bankName(t.bankId))+"</span>":"")+"</span>"+
    "<span class='tier'>"+goalDays(t)+"天</span>"+
    "<span class='ago "+cls+"'>"+txt+"</span></button>";
}
function clientBlock(){
  var act=db.traders.filter(function(t){return t.status==="active";}).length;
  var h="<details class='fold'"+(cmOpen?" open":"")+" id='cmwrap'>";
  h+="<summary><span class='lbl'><span class='caret'>▶</span>客户管理</span>"+
     "<span class='meta'>"+db.banks.length+" 行 · "+act+" 人</span></summary><div class='foldbody'>";
  if(!db.banks.length){
    h+="<div class='empty'><p>还没有银行。</p><button class='btn pri' data-act='addBank'>添加银行</button></div>";
    return h+"</div></details>";
  }
  h+="<div class='seg'>"+
     "<button data-act='mode' data-m='bank' class='"+(mode==="bank"?"on":"")+"'>按银行</button>"+
     "<button data-act='mode' data-m='alpha' class='"+(mode==="alpha"?"on":"")+"'>按字母</button></div>";
  h+="<div class='field'><input id='q' placeholder='搜姓名或银行，可打拼音首字母' value='"+esc(query)+"'></div>";
  var q=query.trim();

  if(mode==="alpha"){
    var all=db.traders.filter(function(t){
      return t.status==="active"&&(!q||matches(t.name,q)||matches(bankName(t.bankId),q));});
    all.sort(sortName);
    var groups={},order=[];
    all.forEach(function(t){
      var L=initial(t.name);
      if(!groups[L]){groups[L]=[];order.push(L);}
      groups[L].push(t);
    });
    order.sort(function(a,b){if(a==="#")return 1;if(b==="#")return -1;return a<b?-1:1;});
    if(!all.length)h+="<div class='empty'><p>没有匹配的人。</p></div>";
    order.forEach(function(L){
      h+="<div class='gh' id='g_"+L+"'>"+L+"</div>";
      groups[L].forEach(function(t){h+=traderRow(t,true);});
    });
    h+="<div class='idx'>";
    LT.forEach(function(L){
      h+="<button data-act='jump' data-l='"+L+"' class='"+(groups[L]?"has":"")+"'>"+L+"</button>";});
    h+="</div>";
  }else{
    sortedBanks().forEach(function(b){
      var ts=activeOf(b.id).sort(sortName);
      var hitBank=!q||matches(b.name,q);
      var shown=ts.filter(function(t){return hitBank||matches(t.name,q);});
      if(q&&!hitBank&&!shown.length)return;
      var seen=ts.filter(function(t){return seenThisCycle(t.id);}).length;
      var open=q?true:!!openBanks[b.id];
      h+="<details class='bank' data-bank='"+b.id+"'"+(open?" open":"")+">";
      h+="<summary><span class='caret'>▶</span>"+(b.pinned?"<span class='pin'>★</span>":"")+
         "<span class='bname'>"+esc(b.name)+"</span>"+
         "<span class='cnt'>"+seen+" / "+ts.length+"</span></summary><div>";
      if(!shown.length)h+="<div style='padding:11px 0 4px 14px' class='sub'>本行还没有交易员</div>";
      shown.forEach(function(t){h+=traderRow(t,false);});
      h+="<div class='row' style='padding:9px 0 13px 14px'>"+
         "<button class='btn sm' data-act='addTrader' data-id='"+b.id+"'>加交易员</button>"+
         "<button class='btn sm' data-act='editBank' data-id='"+b.id+"'>改行名</button>"+
         "</div></div></details>";
    });
    h+="<div class='row' style='margin-top:14px'><button class='btn' data-act='addBank'>添加银行</button></div>";
  }
  return h+"</div></details>";
}

/* ---------- 轮次 ---------- */
function viewBoard(){
  var c=cycleRange();
  var h="<h2 class='sec'>本轮覆盖<small>"+esc(c.label)+" · "+md(c.s)+"–"+md(c.e)+"</small></h2>";
  h+="<div class='sub' style='margin-bottom:12px'>亮灯 = 本轮内有一条应酬记录。点名字直接补记。</div>";
  var any=false;
  sortedBanks().forEach(function(b){
    var ts=activeOf(b.id).sort(sortName);
    if(!ts.length)return;
    any=true;
    var seen=ts.filter(function(t){return seenThisCycle(t.id);}).length;
    h+="<div class='boardbank'><h3>"+(b.pinned?"★ ":"")+esc(b.name)+"<span>"+seen+" / "+ts.length+"</span></h3><div class='chips'>";
    ts.forEach(function(t){
      var on=seenThisCycle(t.id);
      h+="<button class='chip"+(on?" on":"")+"' data-act='quickT' data-id='"+t.id+"'>"+
         "<span class='lamp"+(on?" on":"")+"'></span>"+esc(t.name)+"</button>";
    });
    h+="</div></div>";
  });
  if(!any)h+="<div class='empty'><p>还没有在职交易员。</p></div>";
  var od=db.traders.filter(function(t){return t.status==="active"&&isOverdue(t);})
    .sort(function(a,b){
      var da=overdueDays(a),dbb=overdueDays(b);
      if(da===null&&dbb===null)return sortName(a,b);
      if(da===null)return -1;
      if(dbb===null)return 1;
      return dbb-da;});
  h+="<h2 class='sec'>该约了<small>只看置顶银行 · "+od.length+" 人</small></h2>";
  if(!od.length)h+="<div class='sub'>"+(db.banks.some(function(b){return b.pinned;})?"没有超期的人。":"还没有置顶银行。长按银行名字可以置顶，只有置顶的行才提醒多久没应酬。")+"</div>";
  else od.forEach(function(t){h+=traderRow(t,true);});
  return h;
}

/* ---------- 周报 ---------- */
var MODS=["市场","团队","客户","竞对"];
var DAYN=["周一","周二","周三","周四","周五"];
var wkOff=0, openDays={};

function mondayOf(off){
  var n=new Date(),dow=n.getDay();
  return new Date(n.getFullYear(),n.getMonth(),n.getDate()-(dow===0?6:dow-1)+off*7);
}
function weekBounds(off){
  var mon=mondayOf(off===undefined?wkOff:off);
  return{s:iso(mon),e:iso(new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+6))};
}
function notesOn(ds){return db.notes.filter(function(n){return n.date===ds;});}
function notesIn(s0,e0,mod){
  return db.notes.filter(function(n){
    return n.date>=s0&&n.date<=e0&&(!mod||n.mod===mod);})
    .sort(function(a,b){return a.date<b.date?-1:1;});
}
function eventsIn(s0,e0){
  return db.events.filter(function(x){return x.done&&x.date>=s0&&x.date<=e0;})
    .sort(function(a,b){return a.date<b.date?-1:1;});
}
function viewWeekly(){
  var w=weekBounds();
  var evs=eventsIn(w.s,w.e);
  var nts=notesIn(w.s,w.e);
  var people={};
  evs.forEach(function(x){x.traderIds.forEach(function(id){people[id]=1;});});
  var h="<div class='calhead' style='padding-bottom:14px'>"+
    "<button class='btn sm' data-act='wk' data-d='-1'>‹</button>"+
    "<b>"+md(w.s)+" – "+md(w.e)+(wkOff?"":"　本周")+"</b>"+
    "<button class='btn sm' data-act='wk' data-d='1'>›</button></div>";
  h+="<div class='row' style='gap:26px;margin-bottom:14px'>"+
     "<div><div class='sub'>素材</div><div class='num' style='font-size:24px'>"+nts.length+"</div></div>"+
     "<div><div class='sub'>场次</div><div class='num' style='font-size:24px'>"+evs.length+"</div></div>"+
     "<div><div class='sub'>见到的人</div><div class='num' style='font-size:24px'>"+Object.keys(people).length+"</div></div>"+
     "</div>";
  var mon=mondayOf(wkOff);
  for(var i=0;i<5;i++){
    var d=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i);
    var ds=iso(d);
    var dn=notesOn(ds), de=db.events.filter(function(x){return x.done&&x.date===ds;});
    var isToday=ds===today();
    var open=openDays[ds]!==undefined?openDays[ds]:isToday;
    h+="<details class='fold day-fold' data-day='"+ds+"'"+(open?" open":"")+">";
    h+="<summary><span class='lbl'><span class='caret'>▶</span>"+DAYN[i]+
       "<span class='meta' style='margin-left:6px'>"+md(ds)+"</span></span>"+
       "<span class='meta'>"+(dn.length+de.length?dn.length+" 条 · "+de.length+" 场":"空")+
       (isToday?" · 今天":"")+"</span></summary><div class='foldbody'>";
    de.forEach(function(e){h+=evCard(e);});
    dn.forEach(function(n){
      h+="<div class='note' data-nid='"+n.id+"' data-nd='"+n.date+"'><span class='tag'>"+esc(n.mod)+"</span>"+
         "<span class='ntx'>"+esc(n.text)+"</span>"+
         "<button class='btn sm danger' data-act='delNote' data-id='"+n.id+"'>删</button></div>";
    });
    if(!dn.length&&!de.length)h+="<div class='sub'>这天还没记东西。</div>";
    else if(dn.length)h+="<div class='sub' style='margin-top:7px'>长按某条可以改</div>";
    h+="<div class='row' style='margin-top:10px'><button class='btn sm' data-act='addNote' data-d='"+ds+"'>记一条</button></div>";
    h+="</div></details>";
  }

        lines.push(md(x.date)+" "+(x.type||"应酬")+(x.place?"（"+x.place+"）":"")+"："+names+
          (x.topic?"。"+x.topic:"")+(x.followup?" 跟进："+x.followup:""));
      });
    }

  if(od.length)out.push("【待覆盖】\n· "+od.slice(0,12).map(function(t){return bankName(t.bankId)+" "+t.name;}).join("、"));
  var up=db.events.filter(function(x){return !x.done&&x.date>=today();})
    .sort(function(a,b){return a.date<b.date?-1:1;}).slice(0,8);
  if(up.length)out.push("【下周计划】\n· "+up.map(function(x){
    return md(x.date)+" "+x.traderIds.map(function(id){var t=trader(id);return t?t.name:"";}).filter(Boolean).join("、");
  }).join("；"));
  return md(w.s)+"–"+md(w.e)+" 周报素材\n\n"+out.join("\n");

function shrink(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){
      var img=new Image();
      img.onload=function(){
        var max=1400,w=img.width,h=img.height;
        if(w>max||h>max){var r=Math.min(max/w,max/h);w=Math.round(w*r);h=Math.round(h*r);}
        var cv=document.createElement("canvas");cv.width=w;cv.height=h;
        cv.getContext("2d").drawImage(img,0,0,w,h);
        res(cv.toDataURL("image/jpeg",0.72));
      };
      img.onerror=rej;img.src=fr.result;
    };
    fr.onerror=rej;fr.readAsDataURL(file);
  });
}

/* ---------- 手机日历 ---------- */
function evTimes(e){
  var d=parse(e.date),h=slotOf(e)==="noon"?12:19;
  var st=new Date(d.getFullYear(),d.getMonth(),d.getDate(),h,0,0);
  return{s:st,e:new Date(st.getTime()+7200000)};
}
function stampLocal(x){
  return x.getFullYear()+pad(x.getMonth()+1)+pad(x.getDate())+"T"+pad(x.getHours())+pad(x.getMinutes())+"00";
}
function evTitle(e){
  var names=e.traderIds.map(function(id){var t=trader(id);return t?t.name:"";}).filter(Boolean).join("、");
  return (e.type||"应酬")+"："+(names||"待定");
}
function remindTitle(e){
  return (e.place?"确认安排：":"订位：")+evTitle(e);
}
function evDesc(e){
  var names=e.traderIds.map(function(id){
    var t=trader(id);return t?bankName(t.bankId)+" "+t.name:"";}).filter(Boolean).join("、");
  var l=[];
  if(names)l.push("在场："+names);
  l.push(e.place?("地点："+e.place):"地点未定，需要订位");
  if(e.topic)l.push(e.topic);
  if(e.followup)l.push("跟进："+e.followup);
  return l.join("；");
}
function icsEsc(t){return String(t||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"；");}
var VTZ=["BEGIN:VTIMEZONE","TZID:Asia/Shanghai","BEGIN:STANDARD","DTSTART:19910915T000000",
  "TZOFFSETFROM:+0900","TZOFFSETTO:+0800","TZNAME:CST","END:STANDARD","END:VTIMEZONE"];
function utcStamp(x){
  return x.getUTCFullYear()+pad(x.getUTCMonth()+1)+pad(x.getUTCDate())+"T"+
    pad(x.getUTCHours())+pad(x.getUTCMinutes())+"00Z";
}
/* 北京时间当天 12:00 对应的 UTC 戳，和手机所在时区无关 */
function bjNoonUTC(d){return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"T040000Z";}
function remindAt(e){
  var d=parse(e.date),rd=db.settings.remindDays||3;
  return new Date(d.getFullYear(),d.getMonth(),d.getDate()-rd,12,0,0);
}
function icsEvent(e){
  var t=evTimes(e),ra=remindAt(e);
  var out=["BEGIN:VEVENT","UID:"+e.id+"@crosslink","DTSTAMP:"+utcStamp(new Date()),
    "DTSTART;TZID=Asia/Shanghai:"+stampLocal(t.s),
    "DTEND;TZID=Asia/Shanghai:"+stampLocal(t.e),
    "SUMMARY:"+icsEsc(evTitle(e)),
    "LOCATION:"+icsEsc(e.place||""),
    "DESCRIPTION:"+icsEsc(evDesc(e))];
  if(ra.getTime()>Date.now()-86400000){
    out=out.concat(["BEGIN:VALARM","ACTION:DISPLAY",
      "TRIGGER;VALUE=DATE-TIME:"+bjNoonUTC(ra),
      "DESCRIPTION:"+icsEsc(remindTitle(e)),"END:VALARM"]);
  }
  out.push("END:VEVENT");
  return out.join("\r\n");
}
/* 一条独立的提醒日程：安卓上比 VALARM 可靠得多 */
function icsRemind(e){
  var ra=remindAt(e);
  var en=new Date(ra.getTime()+1800000);
  return ["BEGIN:VEVENT","UID:"+e.id+"-r@crosslink","DTSTAMP:"+utcStamp(new Date()),
    "DTSTART;TZID=Asia/Shanghai:"+stampLocal(ra),
    "DTEND;TZID=Asia/Shanghai:"+stampLocal(en),
    "SUMMARY:"+icsEsc(remindTitle(e)),
    "DESCRIPTION:"+icsEsc(cn(e.date)+(slotOf(e)==="noon"?" 中午":" 晚上")+" 的局；"+evDesc(e)),
    "BEGIN:VALARM","ACTION:DISPLAY","TRIGGER:PT0S",
    "DESCRIPTION:"+icsEsc(remindTitle(e)),"END:VALARM","END:VEVENT"].join("\r\n");
}
function downloadICS(list,fname){
  if(!list.length){toast("没有可导出的计划");return;}
  var blocks=[];
  list.forEach(function(e){
    blocks.push(icsEvent(e));
    if(db.settings.remindEvent!==false&&remindAt(e).getTime()>Date.now()-86400000)
      blocks.push(icsRemind(e));
  });
  var body=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Crosslink//CN","CALSCALE:GREGORIAN","METHOD:PUBLISH"]
    .concat(VTZ).concat(blocks).concat(["END:VCALENDAR"]).join("\r\n");
  var blob=new Blob([body],{type:"text/calendar;charset=utf-8"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=fname;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
  toast("已下载，用日历打开这个文件");
}
function gcalOpen(e){
  var t=evTimes(e);
  var u="https://calendar.google.com/calendar/render?action=TEMPLATE"+
    "&text="+encodeURIComponent(evTitle(e))+
    "&dates="+utcStamp(t.s)+"/"+utcStamp(t.e)+
    "&location="+encodeURIComponent(e.place||"")+
    "&details="+encodeURIComponent(evDesc(e))+
    "&ctz=Asia/Shanghai";
  window.open(u,"_blank");
}

function exportJSON(){
  var blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="Crosslink-"+today()+".json";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href);},1500);
  toast("已导出");
}

/* 长按银行名字 = 打开银行菜单 */
(function(){
  var timer=null,fired=false,sx=0,sy=0;
  var view=document.getElementById("view");
  function clear(){if(timer){clearTimeout(timer);timer=null;}}
  function targetAt(el){
    var sum=el.closest("details.bank>summary");
    if(sum)return function(){sheetBank(sum.parentNode.dataset.bank);};
    var nt=el.closest(".note");
    if(nt&&!el.closest("[data-act]"))return function(){sheetNote(nt.dataset.nd,nt.dataset.nid);};
    return null;
  }
  view.addEventListener("pointerdown",function(ev){
    var fn=targetAt(ev.target);
    if(!fn)return;
    sx=ev.clientX;sy=ev.clientY;fired=false;
    clear();
    timer=setTimeout(function(){
      fired=true;
      if(navigator.vibrate)navigator.vibrate(18);
      fn();
    },520);
  });
  view.addEventListener("pointermove",function(ev){
    if(!timer)return;
    if(Math.abs(ev.clientX-sx)>8||Math.abs(ev.clientY-sy)>8)clear();
  });
  ["pointerup","pointercancel","pointerleave"].forEach(function(t){
    view.addEventListener(t,clear);});
  window.addEventListener("scroll",clear,{passive:true});
  view.addEventListener("click",function(ev){
    if(fired){ev.preventDefault();ev.stopPropagation();fired=false;}
  },true);
  view.addEventListener("contextmenu",function(ev){
    var fn=targetAt(ev.target);
    if(fn){ev.preventDefault();fn();}
  });
})();
